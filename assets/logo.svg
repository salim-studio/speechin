<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="speechin logo">
  <defs>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#060913"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#223055" stroke-width="2"/>
  <!-- microphone capsule -->
  <rect x="25" y="9" width="14" height="23" rx="7" fill="url(#mic)"/>
  <line x1="28" y1="15" x2="36" y2="15" stroke="#060913" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <line x1="28" y1="20" x2="36" y2="20" stroke="#060913" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <line x1="28" y1="25" x2="36" y2="25" stroke="#060913" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <!-- stand arc + stem + base -->
  <path d="M22 33 a10 10 0 0 0 20 0" fill="none" stroke="url(#mic)" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="43" x2="32" y2="50" stroke="url(#mic)" stroke-width="3" stroke-linecap="round"/>
  <line x1="25" y1="52" x2="39" y2="52" stroke="url(#mic)" stroke-width="3" stroke-linecap="round"/>
  <!-- live signal dot -->
  <circle cx="49" cy="13" r="5" fill="#D4FF4F"/>
</svg>
